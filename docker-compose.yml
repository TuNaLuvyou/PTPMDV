services:
  db:
    image: postgres:16-alpine
    container_name: hrm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrm
    ports:
      - "5432:5432"
    volumes:
      - hrm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    container_name: hrm-identity
    build: ./backend/identity-service
    restart: unless-stopped
    env_file:
      - ./backend/identity-service/.env
    environment:
      PORT: 4001
      SERVICE_NAME: identity-service
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway:
    container_name: hrm-gateway
    build: ./backend/api-gateway
    restart: unless-stopped
    env_file:
      - ./backend/api-gateway/.env
    environment:
      PORT: 4000
      SERVICE_NAME: api-gateway
      CORS_ORIGIN: http://localhost:3000
      IDENTITY_URL: http://identity-service:4001
      ORGANIZATION_URL: http://organization-service:4002
      WORK_URL: http://work-service:4003
      PAYROLL_URL: http://payroll-service:4004
      INTEGRATION_URL: http://integration-service:4005
    ports:
      - "4000:4000"
    depends_on:
      - identity-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Các service của B/D/E: chủ sở hữu bật khi đã có code (giữ đúng cổng) ---
  # organization-service: # B — 4002
  #   build: ./backend/organization-service
  #   ports: ["4002:4002"]
  # work-service: # B — 4003
  #   build: ./backend/work-service
  #   ports: ["4003:4003"]
  # payroll-service: # D — 4004
  #   build: ./backend/payroll-service
  #   ports: ["4004:4004"]
  # integration-service: # E — 4005
  #   build: ./backend/integration-service
  #   ports: ["4005:4005"]

volumes:
  hrm-pgdata:
